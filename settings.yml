resource_root_category_ids:
  type: list
  default: "10|61|197"
  description: "Root category IDs for Resource Library (pipe-separated, e.g. 10|61|197)"

topics_per_category:
  type: integer
  default: 5
  min: 1
  max: 50
  description: "Number of topics to show per category on the resource library page"

resource_topic_order:
  type: string
  default: "{}"
  description: "JSON map of category ID to ordered topic IDs (managed automatically by staff reorder)"
